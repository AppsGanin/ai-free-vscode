name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.3)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_BROWSERS_PATH: ./playwright-browsers

      - name: Download Chromium into extension bundle
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ./playwright-browsers

      - name: Package extension
        run: npx @vscode/vsce package --allow-missing-repository

      - name: Get version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-free-vscode-${{ steps.pkg.outputs.version }}
          path: "*.vsix"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AI Free VSCode v${{ steps.pkg.outputs.version }}
          files: "*.vsix"
